spring.application.name=nutikas-restoran

# H2 (in-memory, dev / demo)
spring.datasource.url=jdbc:h2:mem:restaurant;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Broneeringu kestus (tundides)
app.reservation.duration-hours=2

# TheMealDB (https://www.themealdb.com)
app.mealdb.base-url=https://www.themealdb.com
